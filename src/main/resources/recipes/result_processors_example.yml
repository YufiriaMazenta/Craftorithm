# ============================================================
# Craftorithm 结果处理器 (result_processors) 完整写法示例
# ============================================================
# 四种处理策略:
#   copy_from_source  - 从源物品(source)复制组件到结果(result)
#   add               - 直接为结果物品添加指定值
#   merge_source      - 将源物品的组件与结果物品的组件智能合并
#   remove            - 移除结果物品的组件(无data移除全部,有data移除特定项)
#
# sourceItem 含义:
#   铁砧/锻造台 → base物品 | 烧炼/切石/酿造 → 输入物品 | 工作台 → null
#
# 同一组件支持列表格式，按顺序执行多个处理动作:
#   enchantments:
#     - type: copy_from_source
#     - type: remove
#       data:
#         value:
#           - "minecraft:sharpness"
#     - type: add
#       data:
#         minecraft:unbreaking: 3
# ============================================================

type: anvil
result: 'minecraft:diamond_sword'
base: 'minecraft:netherite_sword'
addition: 'minecraft:nether_star'
cost_level: 10

result_processors:

  # --- all: 复制全部ItemMeta (仅支持 copy_from_source, 不支持列表) ---
  all:
    type: copy_from_source

  # --- display_name (单个动作) ---
  display_name:
    type: copy_from_source

  # --- lore (列表格式示例: 先从source复制, 再追加自定义行) ---
  lore:
    - type: copy_from_source
    - type: add
      data:
        value:
          - "&7由铁砧合成"

  # --- enchantments (列表格式示例: 先复制source附魔, 再移除锋利, 再添加经验修补) ---
  enchantments:
    - type: copy_from_source
    - type: remove
      data:
        value:
          - "minecraft:sharpness"
    - type: add
      data:
        minecraft:mending: 1

  # --- attributes (单个动作) ---
  attributes:
    type: merge_source

  # --- item_flag (单个动作) ---
  item_flag:
    type: add
    data:
      value:
        - "HIDE_ENCHANTS"
        - "HIDE_ATTRIBUTES"

  # --- trim ---
  trim:
    type: copy_from_source

  # --- unbreakable ---
  unbreakable:
    type: add
    data:
      value: true

  # --- custom_model_data ---
  custom_model_data:
    type: add
    data:
      value: 1001

  # --- food (1.20.5+) ---
  food:
    type: copy_from_source

  # --- hide_tooltip (1.20.5+) ---
  hide_tooltip:
    type: add
    data:
      value: true

  # --- item_name (1.20.5+) ---
  item_name:
    type: add
    data:
      value: "custom:item_name_key"

  # --- max_stack_size (1.20.5+) ---
  max_stack_size:
    type: add
    data:
      value: 64

  # --- rarity (1.20.5+) ---
  rarity:
    type: copy_from_source

  # --- tool (1.21+) ---
  tool:
    type: copy_from_source

  # --- fire_resistance (1.20.5+) ---
  fire_resistance:
    type: add
    data:
      value: true

  # --- custom_model_data_component (1.21.4+) ---
  custom_model_data_component:
    type: copy_from_source

  # --- item_model (1.21.4+) ---
  item_model:
    type: add
    data:
      value: "minecraft:diamond_sword"

  # --- custom_persistent_data (PDC) ---
  custom_persistent_data:
    # 单个动作: 复制全部PDC
    type: copy_from_source

    # 列表格式示例: 复制后再添加自定义key
    # - type: copy_from_source
    # - type: add
    #   data:
    #     myns:custom_key: "value"

    # copy_from_source + data: 只复制指定key
    # type: copy_from_source
    # data:
    #   key: "myns:mykey"
    #   type: STRING

    # add: 直接设置PDC键值
    # type: add
    # data:
    #   myns:key1: "string_value"
    #   myns:key2: 42

    # merge_source: 合并source的PDC到result
    # type: merge_source

    # remove: 清空全部PDC
    # type: remove

    # remove + data: 移除指定key
    # type: remove
    # data:
    #   keys:
    #     - "myns:key1"
    #     - "myns:key2"
