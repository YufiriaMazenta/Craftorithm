on_craft_diamond_sword:
  type: 'crafting'
  recipes:
    - 'minecraft:diamond_sword'
  conditions:
    mode: script
    body:
      - 'if event.get("view").get("player").invoke("getName") == "Yufiria_"'
      - '  tell("是插件开发者正在进行合成！")'
      - 'endif'
  actions:
    - 'tell("&a合成成功！")'
    - 'give_level(100)'
  priority: 0
  enabled: true
  cooldown: 5
  per_player: true
