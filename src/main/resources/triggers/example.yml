on_craft_diamond_sword:
  type: 'crafting'
  recipes:
    - 'minecraft:diamond_sword'
  conditions:
    mode: script
    body:
      - 'var resultId = match_item_id(event.get("inventory").get("result"))'
      - 'if !perm("craftorithm.craft.${resultId}")'
      - '  tell("You can not craft item ${resultId}")'
      - '  return false'
      - 'endif'
      - 'return true'
  actions:
    - 'tell("&a合成成功！")'
    - 'give_level(100)'
  priority: 0
  enabled: true
  cooldown: 5
  per_player: true
on_join:
  type: player_join
  actions:
    - console("cra discover %player_name% craftorithm:.*")