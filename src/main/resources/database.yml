# 使用什么类型的数据库, 支持sqlite和mysql
type: sqlite

# SQLite专用配置
sqlite:
  # 数据库文件路径（相对或绝对）
  file: "plugins/Craftorithm/data.db"
  parameters: "foreign_keys=true&journal_mode=WAL"

# MySQL专用配置
mysql:
  host: "localhost"
  port: 3306
  database: "craftorithm"
  username: "root"
  password: "your_password"
  parameters: "useSSL=false&serverTimezone=UTC"
  pool:
    check_connection_every_millis: 5000
    max_connection_age_millis: 1800000
    max_connection_free: 10
    test_before_get: true